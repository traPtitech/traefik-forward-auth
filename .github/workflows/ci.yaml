name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: "./go.mod"

    - run: go mod download

    - run: go build -v ./...

    - run: go test -v ./...
