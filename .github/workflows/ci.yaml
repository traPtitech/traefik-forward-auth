name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: "./go.mod"

    - run: go mod download

    - run: go build -v ./...

    - run: go test -v ./...
